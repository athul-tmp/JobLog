<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JobLog Quick Add</title>
    <style>
        /* Colours match the JobLog web app */
        :root {
            --background: #0a0a0a;
            --foreground: #f4f4f4;
            --muted-foreground: #a1a1a1;
            --border: #2c2c2c;
            --input-bg: rgba(255, 255, 255, 0.045);
            --input-border: rgba(255, 255, 255, 0.15);
            --hover: rgba(255, 255, 255, 0.08);
            --primary: #7e22ce;
            --primary-hover: #6b21a8;
            --primary-foreground: #ffffff;
            --link: #c084fc;
            --error: #f87171;
            --success: #4ade80;
            --warning: #fcd34d;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --warning-border: rgba(245, 158, 11, 0.3);
            --gradient-start: #a855f7;
            --gradient-end: #ec4899;
        }

        .light {
            --background: #ffffff;
            --foreground: #0a0a0a;
            --muted-foreground: #737373;
            --border: #e5e5e5;
            --input-bg: #ffffff;
            --input-border: #e5e5e5;
            --hover: #f5f5f5;
            --link: #7e22ce;
            --error: #dc2626;
            --success: #15803d;
            --warning: #92400e;
            --warning-bg: #fffbeb;
            --warning-border: #fde68a;
        }

        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            background-color: var(--background);
            color: var(--foreground);
        }

        .hidden {
            display: none !important;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            background-image: linear-gradient(to right, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--muted-foreground);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 8px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--muted-foreground);
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .icon-btn:hover {
            background-color: var(--hover);
            color: var(--foreground);
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Form */
        label {
            display: block;
            margin: 12px 0 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .optional {
            color: var(--muted-foreground);
            font-weight: 400;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            height: 36px;
            padding: 0 12px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--foreground);
            font: inherit;
        }

        input::placeholder {
            color: var(--muted-foreground);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(126, 34, 206, 0.35);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .password-toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
            height: 36px;
            padding: 0 12px;
            border: none;
            background: transparent;
            color: var(--muted-foreground);
            cursor: pointer;
        }

        .password-toggle-btn:hover {
            color: var(--foreground);
        }

        .password-toggle-btn svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .primary-btn {
            width: 100%;
            height: 38px;
            margin-top: 16px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: var(--primary-foreground);
            font: inherit;
            font-weight: 500;
            cursor: pointer;
        }

        .primary-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Text and status */
        .description {
            margin: 0 0 4px;
            color: var(--muted-foreground);
            line-height: 1.45;
        }

        .section-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted-foreground);
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 0;
            border: none;
            background: none;
            color: var(--link);
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .link-btn:hover {
            text-decoration: underline;
        }

        .link-btn svg {
            width: 13px;
            height: 13px;
        }

        .status {
            margin: 10px 0 0;
            font-size: 13px;
            line-height: 1.45;
            color: var(--muted-foreground);
        }

        .status-error {
            color: var(--error);
        }

        .status-success {
            color: var(--success);
        }

        .validation-error {
            display: block;
            margin-top: 4px;
            color: var(--error);
            font-size: 12px;
        }

        .account-links {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            color: var(--muted-foreground);
            line-height: 1.8;
        }

        a {
            color: var(--link);
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .shortcut-hint {
            margin: 16px 0 0;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted-foreground);
            text-align: center;
        }

        .shortcut-hint kbd {
            padding: 1px 5px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
            font-size: 11px;
        }
    </style>
</head>

<body class="dark">
    <header>
        <div class="brand">
            <span class="logo">JobLog</span>
            <span class="brand-sub">Quick Add</span>
        </div>
        <div class="header-actions">
            <button id="theme-toggle-btn" class="icon-btn" title="Toggle theme">
                <svg id="moon-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </button>
            <button id="header-logout-btn" class="icon-btn hidden" title="Log out">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                Log out
            </button>
        </div>
    </header>

    <div id="loginContainer">
        <form id="loginForm" novalidate>
            <p class="description">Log in to add jobs from LinkedIn, Seek and Indeed in one click.</p>

            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="jobseeker@example.com" autocomplete="email">
            <span id="emailError" class="validation-error hidden"></span>

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
                <button type="button" id="password-toggle" class="password-toggle-btn" title="Show password">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg id="eye-off-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.6-1.71"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                </button>
            </div>
            <span id="passwordError" class="validation-error hidden"></span>

            <p id="loginStatus" class="status hidden"></p>

            <button type="submit" id="loginBtn" class="primary-btn">Log In</button>
        </form>

        <div class="account-links">
            <a href="https://joblog.athulthampan.com/forgot-password" target="_blank" rel="noopener noreferrer">Forgot password?</a><br>
            Don't have an account?
            <a href="https://joblog.athulthampan.com/register" target="_blank" rel="noopener noreferrer">Sign up</a>
        </div>
    </div>

    <div id="jobAddContainer" class="hidden">
        <div class="section-row">
            <span class="section-title">Job details</span>
            <button type="button" id="rescanBtn" class="link-btn" title="Read the job details from this page again">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                Rescan page
            </button>
        </div>
        <p id="statusMessage" class="status"></p>

        <div id="jobFormContainer" class="hidden">
            <form id="jobForm" novalidate>
                <label for="company">Company</label>
                <input type="text" id="company" name="company" placeholder="Company name">
                <span id="companyError" class="validation-error hidden"></span>

                <label for="role">Role</label>
                <input type="text" id="role" name="role" placeholder="Job title">
                <span id="roleError" class="validation-error hidden"></span>

                <label for="link">Job posting URL <span class="optional">(optional)</span></label>
                <input type="text" id="link" name="link" placeholder="https://...">

                <label for="notes">Notes <span class="optional">(optional)</span></label>
                <input type="text" id="notes" name="notes" placeholder="Location, salary or other details">

                <button type="submit" id="submitBtn" class="primary-btn">Save Application</button>
            </form>
        </div>
    </div>

    <p class="shortcut-hint">
        <kbd>Ctrl/Cmd+J</kbd> open on a job page · <kbd>Ctrl/Cmd+Enter</kbd> save
    </p>

    <script src="popup.js"></script>
</body>
</html>
